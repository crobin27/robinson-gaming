name: CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

jobs:
  ci:
    name: CI Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint code (ESLint)
        run: npm run lint
        continue-on-error: false

      - name: Lint CSS (Stylelint)
        run: npm run lint:css
        continue-on-error: false

      - name: Format check
        run: npm run format:check
        continue-on-error: false

      - name: Build
        run: npm run build

      - name: Run unit tests
        run: npm run test
        continue-on-error: false

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        if: always()

      - name: Run E2E smoke tests
        run: npm run test:e2e
        continue-on-error: false
        env:
          BASE_URL: ${{ github.event.pull_request?.head?.repo?.clone_url && 'http://localhost:4321' || 'http://localhost:4321' }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: build-output
          path: dist/
          retention-days: 1
