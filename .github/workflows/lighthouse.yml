name: Lighthouse CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - dev
      - prod
  workflow_dispatch:
    inputs:
      preview_url:
        description: "Preview URL to test"
        required: true

jobs:
  lighthouse:
    name: Lighthouse Performance Audit
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Lighthouse CI
        id: lighthouse
        run: npm run lighthouse:ci
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
          PREVIEW_URL: ${{ github.event.inputs.preview_url || github.event.pull_request?.head?.repo?.html_url && 'https://preview-url-needed' || 'http://localhost:4321' }}
        continue-on-error: true

      - name: Run Accessibility audit
        id: a11y
        run: npm run a11y
        env:
          PREVIEW_URL: ${{ github.event.inputs.preview_url || github.event.pull_request?.head?.repo?.html_url && 'https://preview-url-needed' || 'http://localhost:4321' }}
        continue-on-error: true

      - name: Post Lighthouse results to PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            let lighthouseSummary = '## ? Lighthouse CI Results\n\n';
            let a11ySummary = '## ? Accessibility Audit\n\n';

            // Try to read Lighthouse results
            try {
              const lhciPath = path.join(process.cwd(), '.lighthouseci');
              if (fs.existsSync(lhciPath)) {
                lighthouseSummary += '? Lighthouse audit completed. Check the full report in the workflow logs.\n\n';
              } else {
                lighthouseSummary += '?? Lighthouse results not found. Ensure PREVIEW_URL is set correctly.\n\n';
              }
            } catch (error) {
              lighthouseSummary += '?? Could not read Lighthouse results.\n\n';
            }

            // Try to read a11y results
            try {
              const a11yPath = path.join(process.cwd(), '.a11y-results.json');
              if (fs.existsSync(a11yPath)) {
                const a11yData = JSON.parse(fs.readFileSync(a11yPath, 'utf8'));
                a11ySummary += `? Accessibility audit completed.\n`;
                a11ySummary += `**Violations:** ${a11yData.violations?.length || 0}\n`;
                a11ySummary += `**Passes:** ${a11yData.passes?.length || 0}\n\n`;
              } else {
                a11ySummary += '?? Accessibility results not found.\n\n';
              }
            } catch (error) {
              a11ySummary += '?? Could not read accessibility results.\n\n';
            }

            const commentBody = lighthouseSummary + '\n' + a11ySummary + '\n---\n*Results generated by Lighthouse CI workflow*';

            // Find existing comment
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.data.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('Lighthouse CI Results')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody,
              });
            }
