name: Preview Deployment Comment

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  preview-comment:
    name: Post Preview Deployment Info
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate preview comment
        uses: actions/github-script@v7
        id: preview-info
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            // Check for Vercel preview URL in PR description or comments
            // This assumes Vercel integration is set up and provides preview URLs
            // Users should add VERCEL_URL as a comment or in PR description
            const vercelUrl = pr.head.repo.name ? 
              `https://${pr.head.repo.name.replace(/[^a-z0-9-]/gi, '-')}-${context.repo.owner}.vercel.app` : 
              null;

            const netlifyUrl = pr.head.repo.name ?
              `https://${pr.head.repo.name.replace(/[^a-z0-9-]/gi, '-')}--${context.repo.owner}.netlify.app` : 
              null;

            const commentBody = `## ?? Preview Deployment

            **Branch:** \`${pr.head.ref}\`
            **Commit:** \`${pr.head.sha.substring(0, 7)}\`

            ### Preview URLs
            ${vercelUrl ? `- **Vercel:** ${vercelUrl}` : ''}
            ${netlifyUrl ? `- **Netlify:** ${netlifyUrl}` : ''}
            ${!vercelUrl && !netlifyUrl ? '> ?? No preview URL detected. Please ensure Vercel/Netlify GitHub integration is configured.' : ''}

            ### Setup Instructions
            1. **Vercel:** Connect your GitHub repo at [vercel.com](https://vercel.com) and enable PR previews
            2. **Netlify:** Connect your GitHub repo at [netlify.com](https://netlify.com) and enable PR previews
            3. Preview URLs will appear automatically once configured

            ---
            *This comment is automatically generated by the Preview Deployment workflow.*`;

            return { commentBody };

      - name: Find existing comment
        uses: actions/github-script@v7
        id: find-comment
        with:
          script: |
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.data.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('Preview Deployment')
            );

            return botComment ? { commentId: botComment.id } : { commentId: null };

      - name: Create or update comment
        uses: actions/github-script@v7
        with:
          script: |
            const commentBody = '${{ steps.preview-info.outputs.commentBody }}';
            const commentId = '${{ steps.find-comment.outputs.commentId }}';

            if (commentId && commentId !== 'null') {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: commentId,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody,
              });
            }
