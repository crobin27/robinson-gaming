<svg width="256" height="256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Base felt green -->
    <pattern id="felt-base" patternUnits="userSpaceOnUse" width="256" height="256">
      <rect width="256" height="256" fill="#2d8659"/>
    </pattern>
    
    <!-- Noise pattern to simulate felt fibers -->
    <filter id="noise">
      <feTurbulence baseFrequency="0.9" numOctaves="4" type="fractalNoise" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer in="SourceGraphic">
        <feFuncA type="discrete" tableValues="0.85 0.9 0.88 0.92"/>
      </feComponentTransfer>
    </filter>
    
    <!-- Fiber texture overlay -->
    <pattern id="fiber" patternUnits="userSpaceOnUse" width="8" height="8">
      <rect width="8" height="8" fill="none"/>
      <line x1="0" y1="0" x2="8" y2="8" stroke="rgba(0,0,0,0.1)" stroke-width="0.5"/>
      <line x1="4" y1="0" x2="8" y2="4" stroke="rgba(0,0,0,0.08)" stroke-width="0.3"/>
    </pattern>
  </defs>
  
  <!-- Base color -->
  <rect width="256" height="256" fill="url(#felt-base)"/>
  
  <!-- Fiber overlay -->
  <rect width="256" height="256" fill="url(#fiber)" opacity="0.15"/>
  
  <!-- Subtle noise -->
  <rect width="256" height="256" filter="url(#noise)" opacity="0.1"/>
</svg>
